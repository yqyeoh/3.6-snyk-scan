name: CD Deploy
run-name: Deploying Lambda by ${{ github.actor }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # required to request the GitHub OIDC token
  contents: read

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' # block manual runs on other branches
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.OIDC_ROLE }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false # so $(terraform output -raw ...) returns a clean value

    - name: Terraform init
      run: terraform init

    - name: Terraform fmt
      run: terraform fmt -check

    - name: Terraform plan
      run: terraform plan -no-color -out=tfplan

    - name: Terraform apply
      run: terraform apply -auto-approve tfplan

    - name: Summary
      run: |
        echo '## 🚀 Lambda deployed' >> $GITHUB_STEP_SUMMARY
        echo "Function: \`$(terraform output -raw lambda_function_name)\`" >> $GITHUB_STEP_SUMMARY
